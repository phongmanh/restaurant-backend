    get:
      tags: [reports]
      operationId: dailySalesReport
      summary: 'Sales per local day for up to 93 days, with range totals (manager)'
      description: |
        Every day in the range is listed, with zeros where nothing sold; today shows the bills
        closed so far. A bill counts on the local day it was closed, a correction on the day it was
        made (design/reports.md §2, §6).
      security:
        - staffBearer: []
      x-allowed-when-suspended: true
      parameters:
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
      responses:
        '200':
          description: 'The report'
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailySalesReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  securitySchemes:
    staffBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Staff access token (ES256, `aud` = `staff`, 15 min)
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin access token (ES256, `aud` = `admin`, `amr` contains `otp`, 15 min)
    guestBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Table-session token (ADR-0006; defined in the tables design)
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-rt-staff
      description: |
        Refresh token cookie. `__Secure-rt-staff` or `__Secure-rt-admin`, chosen by
        `audience` in the body. HttpOnly; Secure; SameSite=Strict.

  parameters:
    XClient:
      name: X-Client
      in: header
      required: false
      description: '`<app>/<semver>`, e.g. `customer-android/1.0.0`. Below the minimum → 426'
      schema: { type: string, pattern: '^[a-z0-9-]{1,32}/[0-9]+\.[0-9]+\.[0-9]+$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: One random value per user action, repeated on retries (core-and-auth §4)
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The `ETag` from the last read (core-and-auth §5)
      schema: { type: string, examples: ['"3"'] }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: '`next_cursor` from the previous page'
      schema: { type: string, maxLength: 512 }

    StaffId:
      name: staffId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RestaurantId:
      name: restaurantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MemberStatusFilter:
      name: status
      in: query
      required: false
      schema: { type: string, enum: [invited, active, deactivated] }
    MemberRoleFilter:
      name: role
      in: query
      required: false
      schema: { $ref: '#/components/schemas/StaffRole' }
    RestaurantStatusFilter:
      name: status
      in: query
      required: false
      schema: { type: string, enum: [active, suspended] }
    RestaurantNamePrefix:
      name: q
      in: query
      required: false
      description: Name prefix, case-insensitive
      schema: { type: string, minLength: 1, maxLength: 100 }
    AuditFrom:
      name: from
      in: query
      required: false
      description: 'Default: 7 days ago. At most 92 days before `to`'
      schema: { type: string, format: date-time }
    AuditTo:
      name: to
      in: query
      required: false
      description: 'Default: now'
      schema: { type: string, format: date-time }
    AuditAction:
      name: action
      in: query
      required: false
      description: 'Action prefix, e.g. `staff.`'
      schema: { type: string, maxLength: 64 }
    AuditActor:
      name: actor_id
      in: query
      required: false
      schema: { type: string, format: uuid }
    AuditTarget:
      name: target_id
      in: query
      required: false
      schema: { type: string, format: uuid }
    AuditRestaurant:
      name: restaurant_id
      in: query
      required: true
      description: 'A restaurant ID, or `platform` for the platform chain'
      schema: { type: string, maxLength: 36 }

    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MenuLang:
      name: lang
      in: query
      required: false
      description: 'Default: the restaurant''s first language. A language it doesn''t offer → vi'
      schema: { $ref: '#/components/schemas/Language' }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: The ETag of the copy the client holds; 304 if unchanged
      schema: { type: string }

    TableId:
      name: tableId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CallId:
      name: callId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WaiterCallStatus:
      name: status
      in: query
      required: false
      schema: { type: string, enum: [open, acknowledged], default: open }

    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LineId:
      name: lineId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderStatusFilter:
      name: status
      in: query
      required: false
      description: 'Comma-separated statuses; default `placed,accepted,preparing,ready`'
      schema: { type: string, pattern: '^[a-z_]+(,[a-z_]+)*$', examples: ['placed,accepted'] }
    SessionFilter:
      name: session_id
      in: query
      required: false
      description: 'Only this session''s orders'
      schema: { type: string, format: uuid }
    BusinessDate:
      name: date
      in: query
      required: true
      description: 'Local day in the restaurant''s time zone on which the bills were closed'
      schema: { type: string, format: date }

    EventsAfter:
      name: after
      in: query
      required: false
      description: 'The `cursor` from the last answer or notification; absent = just return the current cursor'
      schema: { type: integer, format: int64, minimum: 0 }
    EventsLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 100 }

    ReportFrom:
      name: from
      in: query
      required: true
      description: 'First local date, in the restaurant''s time zone'
      schema: { type: string, format: date }
    ReportTo:
      name: to
      in: query
      required: true
      description: 'Last local date, included; at most 92 days after `from`'
      schema: { type: string, format: date }

  headers:
    XRequestID:
      description: Request ID generated by the service; quote it to support
      schema: { type: string }
    RetryAfter:
      description: Seconds to wait before retrying
      schema: { type: integer, minimum: 0 }
    ETag:
      description: Current version of the resource, for `If-Match`
      schema: { type: string }
    IdempotentReplayed:
      description: '`true` when this is the stored answer to an earlier request with the same key'
      schema: { type: string, enum: ['true'] }

  responses:
    BadRequest:
      description: 'Invalid request: `malformed_request`, `validation_failed`, `idempotency_key_required`, `password_rejected`'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: '`unauthenticated`: token missing, invalid, expired, wrong audience or its session has ended'
      headers:
        WWW-Authenticate:
          schema: { type: string, examples: ['Bearer'] }
        X-Request-ID: { $ref: '#/components/headers/XRequestID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InvalidCredentials:
      description: '`invalid_credentials`: the same answer for every sign-in failure'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: '`forbidden` (role lacks the operation) or `restaurant_suspended`'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: '`not_found`: also for IDs of another restaurant or session'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    LinkInvalid:
      description: '`link_invalid`: unknown, used, replaced or expired link'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: A state conflict; `code` says which (feature-specific codes, or `idempotency_request_in_progress`)
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: '`precondition_failed`: `If-Match` is stale; reload and retry'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionRequired:
      description: '`precondition_required`: `If-Match` is missing'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    IdempotencyKeyReused:
      description: '`idempotency_key_reused`: the same key was used with a different request'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: '`rate_limited`'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        X-Request-ID: { $ref: '#/components/headers/XRequestID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: '`service_unavailable` or `service_busy`'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        X-Request-ID: { $ref: '#/components/headers/XRequestID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    NotModified:
      description: The client's copy is current (no body)
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
        X-Request-ID: { $ref: '#/components/headers/XRequestID' }
    PayloadTooLarge:
      description: '`payload_too_large`'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: '`unsupported_media_type`'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    OrderConflict:
      description: 'A state conflict; `code` says which. `item_unavailable` lists `unavailable_items`; `orders_not_finished` lists `order_ids`'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/OrderProblem' }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details. Switch on `code`; `title` and `detail` are for developers.
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, examples: ['/problems/validation_failed'] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, description: 'Stable code from `x-error-catalogue`' }
        request_id: { type: string }
        errors:
          type: array
          description: Only on `validation_failed` and `password_rejected`
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string, description: 'JSON Pointer into the body, or `query.<name>` / `header.<name>`', examples: ['/lines/0/quantity'] }
        code: { type: string, examples: [out_of_range, required, too_long, too_short, too_common, matches_email] }
        message: { type: string, description: 'English, for developers' }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: '^-?[0-9]{1,15}$', description: Whole đồng, examples: ['125000'] }
        currency: { type: string, enum: [VND] }
    Page:
      type: object
      description: Shape of every list response; `items` is typed per endpoint
      required: [items]
      properties:
        items: { type: array, items: {} }
        next_cursor: { type: string, description: Absent on the last page }

    Email:
      type: string
      format: email
      maxLength: 254
    Password:
      type: string
      description: 8–64 characters after NFC normalisation; checked on set, not on sign-in
      maxLength: 256
    Audience:
      type: string
      enum: [staff, admin]
    StaffRole:
      type: string
      enum: [manager, waiter, kitchen]

    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        password: { type: string, minLength: 1, maxLength: 256 }
    SignInResponse:
      oneOf:
        - $ref: '#/components/schemas/TokenResponse'
        - $ref: '#/components/schemas/MfaRequiredResponse'
    TokenResponse:
      type: object
      required: [mfa_required, access_token, token_type, expires_in, audience]
      properties:
        mfa_required: { type: boolean, const: false }
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, description: Seconds, examples: [900] }
        audience: { $ref: '#/components/schemas/Audience' }
    MfaRequiredResponse:
      type: object
      required: [mfa_required, mfa_token, expires_in]
      properties:
        mfa_required: { type: boolean, const: true }
        mfa_token: { type: string, description: Single use }
        expires_in: { type: integer, examples: [300] }
    MfaRequest:
      type: object
      required: [mfa_token, code]
      properties:
        mfa_token: { type: string, maxLength: 128 }
        code: { type: string, pattern: '^[0-9]{6}$' }
    AudienceRequest:
      type: object
      required: [audience]
      properties:
        audience: { $ref: '#/components/schemas/Audience' }
    LinkTokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, maxLength: 128, description: From the link's URL fragment }
    LinkDetails:
      type: object
      required: [kind, email, display_name, totp_enrolment_required]
      properties:
        kind: { type: string, enum: [invitation, password_reset] }
        email: { $ref: '#/components/schemas/Email' }
        display_name: { type: string }
        restaurant_name: { type: string, description: Absent for platform admins }
        role: { $ref: '#/components/schemas/StaffRole' }
        totp_enrolment_required: { type: boolean }
    AcceptInvitationRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string, maxLength: 128 }
        password: { $ref: '#/components/schemas/Password' }
        totp_code: { type: string, pattern: '^[0-9]{6}$', description: 'Admins, second call only' }
    TotpSetupResponse:
      type: object
      required: [totp_setup]
      properties:
        totp_setup:
          type: object
          required: [secret, otpauth_uri]
          properties:
            secret: { type: string, description: Base32 }
            otpauth_uri: { type: string, description: For a QR code in the admin console }
    CompletePasswordResetRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string, maxLength: 128 }
        password: { $ref: '#/components/schemas/Password' }
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, minLength: 1, maxLength: 256 }
        new_password: { $ref: '#/components/schemas/Password' }
    Me:
      type: object
      required: [staff_id, email, display_name, platform_admin, amr, session_expires_at]
      properties:
        staff_id: { type: string, format: uuid }
        email: { $ref: '#/components/schemas/Email' }
        display_name: { type: string }
        role: { $ref: '#/components/schemas/StaffRole' }
        restaurant:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        platform_admin: { type: boolean }
        amr: { type: array, items: { type: string, enum: [pwd, otp] } }
        session_expires_at: { type: string, format: date-time }

    Language:
      type: string
      enum: [vi, en]
    LocalTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
    OpeningInterval:
      type: object
      required: [opens, closes]
      description: '`closes` at or before `opens` means the interval ends after midnight'
      properties:
        opens: { $ref: '#/components/schemas/LocalTime' }
        closes: { $ref: '#/components/schemas/LocalTime' }
    OpeningDay:
      type: array
      maxItems: 3
      items: { $ref: '#/components/schemas/OpeningInterval' }
    OpeningHours:
      type: object
      description: Local time; a missing or empty day is closed. Display only in release 1
      additionalProperties: false
      properties:
        mon: { $ref: '#/components/schemas/OpeningDay' }
        tue: { $ref: '#/components/schemas/OpeningDay' }
        wed: { $ref: '#/components/schemas/OpeningDay' }
        thu: { $ref: '#/components/schemas/OpeningDay' }
        fri: { $ref: '#/components/schemas/OpeningDay' }
        sat: { $ref: '#/components/schemas/OpeningDay' }
        sun: { $ref: '#/components/schemas/OpeningDay' }
    TimeZone:
      type: string
      description: 'IANA region ID, e.g. `Asia/Ho_Chi_Minh`; offsets like `UTC+7` are refused'
      maxLength: 64
    Phone:
      type: string
      pattern: '^\+[1-9][0-9]{6,14}$'
      description: E.164
    Restaurant:
      type: object
      required: [id, name, address, time_zone, currency, languages, opening_hours, status, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        address: { type: string, minLength: 1, maxLength: 300 }
        time_zone: { $ref: '#/components/schemas/TimeZone' }
        currency: { type: string, enum: [VND] }
        languages: { type: array, items: { $ref: '#/components/schemas/Language' }, minItems: 1, uniqueItems: true }
        opening_hours: { $ref: '#/components/schemas/OpeningHours' }
        status: { type: string, enum: [active, suspended] }
        version: { type: integer }
    OwnerContact:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        email: { $ref: '#/components/schemas/Email' }
        phone: { $ref: '#/components/schemas/Phone' }
    AdminRestaurant:
      allOf:
        - $ref: '#/components/schemas/Restaurant'
        - type: object
          required: [created_at]
          properties:
            owner_contact: { $ref: '#/components/schemas/OwnerContact' }
            suspended_at: { type: string, format: date-time }
            suspension_reason: { type: string, maxLength: 500 }
            created_at: { type: string, format: date-time }
    RestaurantPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminRestaurant' } }
        next_cursor: { type: string }
    RestaurantUpdate:
      type: object
      description: Only the fields to change. `languages` must include `vi`
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        address: { type: string, minLength: 1, maxLength: 300 }
        time_zone: { $ref: '#/components/schemas/TimeZone' }
        languages: { type: array, items: { $ref: '#/components/schemas/Language' }, minItems: 1, uniqueItems: true }
        opening_hours: { $ref: '#/components/schemas/OpeningHours' }
    AdminRestaurantUpdate:
      allOf:
        - $ref: '#/components/schemas/RestaurantUpdate'
        - type: object
          properties:
            owner_contact: { $ref: '#/components/schemas/OwnerContact' }
    SuspendRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    OnboardRestaurantRequest:
      type: object
      required: [name, address, first_manager]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        address: { type: string, minLength: 1, maxLength: 300 }
        time_zone: { $ref: '#/components/schemas/TimeZone' }
        languages: { type: array, items: { $ref: '#/components/schemas/Language' }, minItems: 1, uniqueItems: true }
        opening_hours: { $ref: '#/components/schemas/OpeningHours' }
        owner_contact: { $ref: '#/components/schemas/OwnerContact' }
        first_manager:
          type: object
          required: [email, display_name]
          properties:
            email: { $ref: '#/components/schemas/Email' }
            display_name: { type: string, minLength: 1, maxLength: 100 }
            phone: { $ref: '#/components/schemas/Phone' }
    OnboardRestaurantResponse:
      type: object
      required: [restaurant, first_manager, invitation]
      properties:
        restaurant: { $ref: '#/components/schemas/AdminRestaurant' }
        first_manager: { $ref: '#/components/schemas/Member' }
        invitation: { $ref: '#/components/schemas/IssuedLink' }
    IssuedLink:
      type: object
      required: [link, expires_at]
      description: One-time link, shown once and never stored in plain text. Pass it on to the person
      properties:
        link: { type: string, examples: ['https://staff.example.invalid/invite#<token>'] }
        expires_at: { type: string, format: date-time }
    Member:
      type: object
      required: [id, email, display_name, role, status, created_at, version]
      properties:
        id: { type: string, format: uuid }
        email: { $ref: '#/components/schemas/Email' }
        display_name: { type: string, minLength: 1, maxLength: 100 }
        phone: { $ref: '#/components/schemas/Phone' }
        role: { $ref: '#/components/schemas/StaffRole' }
        status: { type: string, enum: [invited, active, deactivated] }
        created_at: { type: string, format: date-time }
        deactivated_at: { type: string, format: date-time }
        version: { type: integer }
    MemberPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Member' } }
        next_cursor: { type: string }
    InviteMemberRequest:
      type: object
      required: [email, display_name, role]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        display_name: { type: string, minLength: 1, maxLength: 100 }
        phone: { $ref: '#/components/schemas/Phone' }
        role: { $ref: '#/components/schemas/StaffRole' }
    InvitedMember:
      type: object
      required: [member, invitation]
      properties:
        member: { $ref: '#/components/schemas/Member' }
        invitation: { $ref: '#/components/schemas/IssuedLink' }
    MemberUpdate:
      type: object
      minProperties: 1
      properties:
        display_name: { type: string, minLength: 1, maxLength: 100 }
        phone: { $ref: '#/components/schemas/Phone' }
        role: { $ref: '#/components/schemas/StaffRole' }
    AdminAccount:
