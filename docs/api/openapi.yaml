openapi: 3.1.0
info:
  title: Restaurant ordering API
  version: 0.2.0-draft
  description: |
    Contract for the restaurant ordering service (`docs/sdlc/restaurant-ordering/`).
    Hand-written in Phase 3 and frozen at G3 (architecture §5, ADR-0007).
    Built up one feature design at a time; this draft holds the shared parts and
    `/v1/auth/*` from `design/core-and-auth.md`, and the routes of
    `design/restaurants.md`. `x-allowed-when-suspended` on staff and guest
    operations mirrors the endpoint registry (restaurants §6).

    Conventions (core-and-auth §2): snake_case fields; UUID v7 IDs; RFC 3339 UTC times;
    money as `{"amount": "<whole đồng>", "currency": "VND"}`; errors as
    `application/problem+json` with a stable `code` (catalogue in `x-error-catalogue`).
servers:
  - url: https://api.example.invalid
    description: Placeholder until the environments' URLs are fixed

tags:
  - name: auth
    description: Staff and admin sign-in, sessions, invitations and password resets
  - name: restaurants
    description: The caller's own restaurant profile
  - name: staff
    description: Staff management in a restaurant
  - name: audit
    description: Reading the audit log
  - name: admin
    description: Platform-admin operations on restaurants and admins
  - name: privacy
    description: Staff data export and erasure requests

paths:
  /v1/auth/sign-in:
    post:
      tags: [auth]
      operationId: signIn
      security: []   # no token: public sign-in route
      summary: Sign in with email and password
      description: |
        Staff get tokens straight away. Platform admins get an MFA challenge instead
        (`mfa_required: true`) and finish with `POST /v1/auth/mfa`.
        Unknown email, wrong password, locked and deactivated accounts all give the
        same `401 invalid_credentials`.
      parameters:
        - $ref: '#/components/parameters/XClient'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignInRequest' }
      responses:
        '200':
          description: Signed in (staff), or MFA required (admin)
          headers:
            Set-Cookie:
              description: Refresh cookie, staff only (`__Secure-rt-staff`)
              schema: { type: string }
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignInResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/auth/mfa:
    post:
      tags: [auth]
      operationId: completeMfa
      security: []   # no token: public sign-in route
      summary: Finish an admin sign-in with a TOTP code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaRequest' }
      responses:
        '200':
          description: Signed in as admin
          headers:
            Set-Cookie:
              description: Refresh cookie (`__Secure-rt-admin`)
              schema: { type: string }
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshTokens
      summary: Swap the refresh cookie for a new access token and a new refresh cookie
      description: |
        The refresh token is single-use. Presenting one that was already used ends the
        whole session (core-and-auth §8.3).
      security:
        - refreshCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AudienceRequest' }
      responses:
        '200':
          description: New tokens
          headers:
            Set-Cookie:
              description: The replacement refresh cookie
              schema: { type: string }
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/sign-out:
    post:
      tags: [auth]
      operationId: signOut
      summary: End the session
      description: Always 204, even if no session matched.
      security:
        - refreshCookie: []
        - staffBearer: []
        - adminBearer: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AudienceRequest' }
      responses:
        '204':
          description: Signed out; the refresh cookie is cleared
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/links/inspect:
    post:
      tags: [auth]
      operationId: inspectLink
      security: []   # no token: public sign-in route
      summary: Show what an invitation or reset link is for, without using it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkTokenRequest' }
      responses:
        '200':
          description: Link details
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkDetails' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/LinkInvalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/invitations/accept:
    post:
      tags: [auth]
      operationId: acceptInvitation
      security: []   # no token: public sign-in route
      summary: Set a password through an invitation link (and enrol TOTP for an admin)
      description: |
        Staff: one call → 204. Platform admin: the first call (without `totp_code`)
        returns `totp_setup` and leaves the link valid; the second call with the same
        token and password plus `totp_code` → 204 (core-and-auth §8.5).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInvitationRequest' }
      responses:
        '200':
          description: 'Admin only: scan this secret, then call again with a code'
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpSetupResponse' }
        '204':
          description: Account active; sign in next
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/LinkInvalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/password-resets/complete:
    post:
      tags: [auth]
      operationId: completePasswordReset
      security: []   # no token: public sign-in route
      summary: Set a new password through a reset link
      description: Ends all of the person's sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompletePasswordResetRequest' }
      responses:
        '204':
          description: Password changed; sign in next
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/LinkInvalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change your own password
      description: Ends all of the person's sessions, including this one.
      security:
        - staffBearer: []
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204':
          description: Password changed; sign in again
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Who the signed-in caller is
      security:
        - staffBearer: []
        - adminBearer: []
      responses:
        '200':
          description: The caller
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/staff/restaurant:
    get:
      tags: [restaurants]
      operationId: getOwnRestaurant
      summary: Read your restaurant's profile (all roles)
      security:
        - staffBearer: []
      x-allowed-when-suspended: true
      responses:
        '200':
          description: The profile
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Restaurant' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [restaurants]
      operationId: updateOwnRestaurant
      summary: Edit your restaurant's profile (manager)
      security:
        - staffBearer: []
      x-allowed-when-suspended: false
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestaurantUpdate' }
      responses:
        '200':
          description: Updated
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Restaurant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /v1/staff/members:
    get:
      tags: [staff]
      operationId: listMembers
      summary: List staff members
      security:
        - staffBearer: []
      x-allowed-when-suspended: false
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/MemberStatusFilter'
        - $ref: '#/components/parameters/MemberRoleFilter'
      responses:
        '200':
          description: A page of members
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [staff]
      operationId: inviteMember
      summary: Invite a staff member; the response holds the one-time link
      security:
        - staffBearer: []
      x-allowed-when-suspended: false
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteMemberRequest' }
      responses:
        '201':
          description: Invited
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitedMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/staff/members/{staffId}:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    get:
      tags: [staff]
      operationId: getMember
      summary: Read a staff member
      security:
        - staffBearer: []
      x-allowed-when-suspended: false
      responses:
        '200':
          description: The member
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [staff]
      operationId: updateMember
      summary: Change name, phone or role (role change ends their sessions)
      security:
        - staffBearer: []
      x-allowed-when-suspended: false
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberUpdate' }
      responses:
        '200':
          description: Updated
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /v1/staff/members/{staffId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    post:
      tags: [staff]
      operationId: deactivateMember
      summary: Deactivate (ends their sessions)
      security:
        - staffBearer: []
      x-allowed-when-suspended: false
      responses:
        '200':
          description: Deactivated, or already was
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/staff/members/{staffId}/reactivate:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    post:
      tags: [staff]
      operationId: reactivateMember
      summary: Reactivate a deactivated member who isn't anonymised yet
      security:
        - staffBearer: []
      x-allowed-when-suspended: false
      responses:
        '200':
          description: Active
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/staff/members/{staffId}/invitation:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    post:
      tags: [staff]
      operationId: invitationMember
      summary: Re-issue the invitation link; the old one stops working
      security:
        - staffBearer: []
      x-allowed-when-suspended: false
      responses:
        '201':
          description: New link
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedLink' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/staff/members/{staffId}/password-reset:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    post:
      tags: [staff]
      operationId: passwordResetMember
      summary: Issue a password-reset link (24 h)
      security:
        - staffBearer: []
      x-allowed-when-suspended: false
      responses:
        '201':
          description: New link
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedLink' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/staff/audit-events:
    get:
      tags: [audit]
      operationId: listOwnAuditEvents
      summary: Read your restaurant's audit log (manager; no IP or user agent)
      security:
        - staffBearer: []
      x-allowed-when-suspended: true
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
        - $ref: '#/components/parameters/AuditAction'
        - $ref: '#/components/parameters/AuditActor'
        - $ref: '#/components/parameters/AuditTarget'
      responses:
        '200':
          description: Newest first
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/restaurants:
    get:
      tags: [admin]
      operationId: listRestaurants
      summary: List restaurants
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/RestaurantStatusFilter'
        - $ref: '#/components/parameters/RestaurantNamePrefix'
      responses:
        '200':
          description: A page of restaurants
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestaurantPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [admin]
      operationId: onboardRestaurant
      summary: Onboard a restaurant and invite its first manager
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardRestaurantRequest' }
      responses:
        '201':
          description: Created. A replay with the same key returns the restaurant with a fresh link
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardRestaurantResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }

  /v1/admin/restaurants/{restaurantId}:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    get:
      tags: [admin]
      operationId: getRestaurant
      summary: Read a restaurant (admin view)
      security:
        - adminBearer: []
      responses:
        '200':
          description: The restaurant
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRestaurant' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [admin]
      operationId: updateRestaurant
      summary: Edit a restaurant, including the owner contact
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminRestaurantUpdate' }
      responses:
        '200':
          description: Updated
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRestaurant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /v1/admin/restaurants/{restaurantId}/suspend:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    post:
      tags: [admin]
      operationId: suspendRestaurant
      summary: Suspend a restaurant (idempotent; no data is deleted)
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuspendRequest' }
      responses:
        '200':
          description: Suspended
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRestaurant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/restaurants/{restaurantId}/reactivate:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    post:
      tags: [admin]
      operationId: reactivateRestaurant
      summary: Reactivate a restaurant (idempotent)
      security:
        - adminBearer: []
      responses:
        '200':
          description: Active
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRestaurant' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/restaurants/{restaurantId}/members:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    get:
      tags: [staff]
      operationId: listRestaurantMembers
      summary: List staff members
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/MemberStatusFilter'
        - $ref: '#/components/parameters/MemberRoleFilter'
      responses:
        '200':
          description: A page of members
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [staff]
      operationId: inviteRestaurantMember
      summary: Invite a staff member; the response holds the one-time link
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteMemberRequest' }
      responses:
        '201':
          description: Invited
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitedMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/restaurants/{restaurantId}/members/{staffId}:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/StaffId'
    get:
      tags: [staff]
      operationId: getRestaurantMember
      summary: Read a staff member
      security:
        - adminBearer: []
      responses:
        '200':
          description: The member
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [staff]
      operationId: updateRestaurantMember
      summary: Change name, phone or role (role change ends their sessions)
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberUpdate' }
      responses:
        '200':
          description: Updated
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /v1/admin/restaurants/{restaurantId}/members/{staffId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/StaffId'
    post:
      tags: [staff]
      operationId: deactivateRestaurantMember
      summary: Deactivate (ends their sessions)
      security:
        - adminBearer: []
      responses:
        '200':
          description: Deactivated, or already was
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/restaurants/{restaurantId}/members/{staffId}/reactivate:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/StaffId'
    post:
      tags: [staff]
      operationId: reactivateRestaurantMember
      summary: Reactivate a deactivated member who isn't anonymised yet
      security:
        - adminBearer: []
      responses:
        '200':
          description: Active
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/restaurants/{restaurantId}/members/{staffId}/invitation:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/StaffId'
    post:
      tags: [staff]
      operationId: invitationRestaurantMember
      summary: Re-issue the invitation link; the old one stops working
      security:
        - adminBearer: []
      responses:
        '201':
          description: New link
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedLink' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/admin/restaurants/{restaurantId}/members/{staffId}/password-reset:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/StaffId'
    post:
      tags: [staff]
      operationId: passwordResetRestaurantMember
      summary: Issue a password-reset link (24 h)
      security:
        - adminBearer: []
      responses:
        '201':
          description: New link
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedLink' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/admin/admins:
    get:
      tags: [admin]
      operationId: listAdmins
      summary: List platform admins
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of admins
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAccountPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [admin]
      operationId: inviteAdmin
      summary: Invite a platform admin (enrols TOTP on acceptance)
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteAdminRequest' }
      responses:
        '201':
          description: Invited
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitedAdmin' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/admins/{staffId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    post:
      tags: [admin]
      operationId: deactivateAdmin
      summary: Deactivate another platform admin
      security:
        - adminBearer: []
      responses:
        '200':
          description: Deactivated
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAccount' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/admins/{staffId}/password-reset:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    post:
      tags: [admin]
      operationId: passwordResetAdmin
      summary: Issue a password-reset link for another admin
      security:
        - adminBearer: []
      responses:
        '201':
          description: New link
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedLink' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/admins/{staffId}/totp-reset:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    post:
      tags: [admin]
      operationId: totpResetAdmin
      summary: 'Reset another admin''s lost authenticator: back to invited, with a new invitation link'
      security:
        - adminBearer: []
      responses:
        '201':
          description: New invitation link
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedLink' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/audit-events:
    get:
      tags: [audit]
      operationId: listAuditEvents
      summary: Read any restaurant's audit log, or the platform chain (this read is audited)
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/AuditRestaurant'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
        - $ref: '#/components/parameters/AuditAction'
        - $ref: '#/components/parameters/AuditActor'
        - $ref: '#/components/parameters/AuditTarget'
      responses:
        '200':
          description: Newest first
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAuditEventPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/staff-accounts/{staffId}/export:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    get:
      tags: [privacy]
      operationId: exportStaffData
      summary: Export a staff member's personal data (privacy request)
      security:
        - adminBearer: []
      responses:
        '200':
          description: The data
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffDataExport' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/staff-accounts/{staffId}/erase:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    post:
      tags: [privacy]
      operationId: eraseStaffData
      summary: Deactivate and anonymise a staff account now (privacy request)
      security:
        - adminBearer: []
      responses:
        '200':
          description: Erased
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EraseResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    staffBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Staff access token (ES256, `aud` = `staff`, 15 min)
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin access token (ES256, `aud` = `admin`, `amr` contains `otp`, 15 min)
    guestBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Table-session token (ADR-0006; defined in the tables design)
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-rt-staff
      description: |
        Refresh token cookie. `__Secure-rt-staff` or `__Secure-rt-admin`, chosen by
        `audience` in the body. HttpOnly; Secure; SameSite=Strict.

  parameters:
    XClient:
      name: X-Client
      in: header
      required: false
      description: '`<app>/<semver>`, e.g. `customer-android/1.0.0`. Below the minimum → 426'
      schema: { type: string, pattern: '^[a-z0-9-]{1,32}/[0-9]+\.[0-9]+\.[0-9]+$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: One random value per user action, repeated on retries (core-and-auth §4)
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The `ETag` from the last read (core-and-auth §5)
      schema: { type: string, examples: ['"3"'] }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: '`next_cursor` from the previous page'
      schema: { type: string, maxLength: 512 }

    StaffId:
      name: staffId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RestaurantId:
      name: restaurantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MemberStatusFilter:
      name: status
      in: query
      required: false
      schema: { type: string, enum: [invited, active, deactivated] }
    MemberRoleFilter:
      name: role
      in: query
      required: false
      schema: { $ref: '#/components/schemas/StaffRole' }
    RestaurantStatusFilter:
      name: status
      in: query
      required: false
      schema: { type: string, enum: [active, suspended] }
    RestaurantNamePrefix:
      name: q
      in: query
      required: false
      description: Name prefix, case-insensitive
      schema: { type: string, minLength: 1, maxLength: 100 }
    AuditFrom:
      name: from
      in: query
      required: false
      description: 'Default: 7 days ago. At most 92 days before `to`'
      schema: { type: string, format: date-time }
    AuditTo:
      name: to
      in: query
      required: false
      description: 'Default: now'
      schema: { type: string, format: date-time }
    AuditAction:
      name: action
      in: query
      required: false
      description: 'Action prefix, e.g. `staff.`'
      schema: { type: string, maxLength: 64 }
    AuditActor:
      name: actor_id
      in: query
      required: false
      schema: { type: string, format: uuid }
    AuditTarget:
      name: target_id
      in: query
      required: false
      schema: { type: string, format: uuid }
    AuditRestaurant:
      name: restaurant_id
      in: query
      required: true
      description: 'A restaurant ID, or `platform` for the platform chain'
      schema: { type: string, maxLength: 36 }

  headers:
    XRequestID:
      description: Request ID generated by the service; quote it to support
      schema: { type: string }
    RetryAfter:
      description: Seconds to wait before retrying
      schema: { type: integer, minimum: 0 }
    ETag:
      description: Current version of the resource, for `If-Match`
      schema: { type: string }
    IdempotentReplayed:
      description: '`true` when this is the stored answer to an earlier request with the same key'
      schema: { type: string, enum: ['true'] }

  responses:
    BadRequest:
      description: 'Invalid request: `malformed_request`, `validation_failed`, `idempotency_key_required`, `password_rejected`'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: '`unauthenticated`: token missing, invalid, expired, wrong audience or its session has ended'
      headers:
        WWW-Authenticate:
          schema: { type: string, examples: ['Bearer'] }
        X-Request-ID: { $ref: '#/components/headers/XRequestID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InvalidCredentials:
      description: '`invalid_credentials`: the same answer for every sign-in failure'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: '`forbidden` (role lacks the operation) or `restaurant_suspended`'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: '`not_found`: also for IDs of another restaurant or session'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    LinkInvalid:
      description: '`link_invalid`: unknown, used, replaced or expired link'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: A state conflict; `code` says which (feature-specific codes, or `idempotency_request_in_progress`)
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: '`precondition_failed`: `If-Match` is stale; reload and retry'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionRequired:
      description: '`precondition_required`: `If-Match` is missing'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    IdempotencyKeyReused:
      description: '`idempotency_key_reused`: the same key was used with a different request'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: '`rate_limited`'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        X-Request-ID: { $ref: '#/components/headers/XRequestID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: '`service_unavailable` or `service_busy`'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        X-Request-ID: { $ref: '#/components/headers/XRequestID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details. Switch on `code`; `title` and `detail` are for developers.
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, examples: ['/problems/validation_failed'] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, description: 'Stable code from `x-error-catalogue`' }
        request_id: { type: string }
        errors:
          type: array
          description: Only on `validation_failed` and `password_rejected`
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string, description: 'JSON Pointer into the body, or `query.<name>` / `header.<name>`', examples: ['/lines/0/quantity'] }
        code: { type: string, examples: [out_of_range, required, too_long, too_short, too_common, matches_email] }
        message: { type: string, description: 'English, for developers' }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: '^-?[0-9]{1,15}$', description: Whole đồng, examples: ['125000'] }
        currency: { type: string, enum: [VND] }
    Page:
      type: object
      description: Shape of every list response; `items` is typed per endpoint
      required: [items]
      properties:
        items: { type: array, items: {} }
        next_cursor: { type: string, description: Absent on the last page }

    Email:
      type: string
      format: email
      maxLength: 254
    Password:
      type: string
      description: 8–64 characters after NFC normalisation; checked on set, not on sign-in
      maxLength: 256
    Audience:
      type: string
      enum: [staff, admin]
    StaffRole:
      type: string
      enum: [manager, waiter, kitchen]

    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        password: { type: string, minLength: 1, maxLength: 256 }
    SignInResponse:
      oneOf:
        - $ref: '#/components/schemas/TokenResponse'
        - $ref: '#/components/schemas/MfaRequiredResponse'
    TokenResponse:
      type: object
      required: [mfa_required, access_token, token_type, expires_in, audience]
      properties:
        mfa_required: { type: boolean, const: false }
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, description: Seconds, examples: [900] }
        audience: { $ref: '#/components/schemas/Audience' }
    MfaRequiredResponse:
      type: object
      required: [mfa_required, mfa_token, expires_in]
      properties:
        mfa_required: { type: boolean, const: true }
        mfa_token: { type: string, description: Single use }
        expires_in: { type: integer, examples: [300] }
    MfaRequest:
      type: object
      required: [mfa_token, code]
      properties:
        mfa_token: { type: string, maxLength: 128 }
        code: { type: string, pattern: '^[0-9]{6}$' }
    AudienceRequest:
      type: object
      required: [audience]
      properties:
        audience: { $ref: '#/components/schemas/Audience' }
    LinkTokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, maxLength: 128, description: From the link's URL fragment }
    LinkDetails:
      type: object
      required: [kind, email, display_name, totp_enrolment_required]
      properties:
        kind: { type: string, enum: [invitation, password_reset] }
        email: { $ref: '#/components/schemas/Email' }
        display_name: { type: string }
        restaurant_name: { type: string, description: Absent for platform admins }
        role: { $ref: '#/components/schemas/StaffRole' }
        totp_enrolment_required: { type: boolean }
    AcceptInvitationRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string, maxLength: 128 }
        password: { $ref: '#/components/schemas/Password' }
        totp_code: { type: string, pattern: '^[0-9]{6}$', description: 'Admins, second call only' }
    TotpSetupResponse:
      type: object
      required: [totp_setup]
      properties:
        totp_setup:
          type: object
          required: [secret, otpauth_uri]
          properties:
            secret: { type: string, description: Base32 }
            otpauth_uri: { type: string, description: For a QR code in the admin console }
    CompletePasswordResetRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string, maxLength: 128 }
        password: { $ref: '#/components/schemas/Password' }
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, minLength: 1, maxLength: 256 }
        new_password: { $ref: '#/components/schemas/Password' }
    Me:
      type: object
      required: [staff_id, email, display_name, platform_admin, amr, session_expires_at]
      properties:
        staff_id: { type: string, format: uuid }
        email: { $ref: '#/components/schemas/Email' }
        display_name: { type: string }
        role: { $ref: '#/components/schemas/StaffRole' }
        restaurant:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        platform_admin: { type: boolean }
        amr: { type: array, items: { type: string, enum: [pwd, otp] } }
        session_expires_at: { type: string, format: date-time }

    Language:
      type: string
      enum: [vi, en]
    LocalTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
    OpeningInterval:
      type: object
      required: [opens, closes]
      description: '`closes` at or before `opens` means the interval ends after midnight'
      properties:
        opens: { $ref: '#/components/schemas/LocalTime' }
        closes: { $ref: '#/components/schemas/LocalTime' }
    OpeningDay:
      type: array
      maxItems: 3
      items: { $ref: '#/components/schemas/OpeningInterval' }
    OpeningHours:
      type: object
      description: Local time; a missing or empty day is closed. Display only in release 1
      additionalProperties: false
      properties:
        mon: { $ref: '#/components/schemas/OpeningDay' }
        tue: { $ref: '#/components/schemas/OpeningDay' }
        wed: { $ref: '#/components/schemas/OpeningDay' }
        thu: { $ref: '#/components/schemas/OpeningDay' }
        fri: { $ref: '#/components/schemas/OpeningDay' }
        sat: { $ref: '#/components/schemas/OpeningDay' }
        sun: { $ref: '#/components/schemas/OpeningDay' }
    TimeZone:
      type: string
      description: 'IANA region ID, e.g. `Asia/Ho_Chi_Minh`; offsets like `UTC+7` are refused'
      maxLength: 64
    Phone:
      type: string
      pattern: '^\+[1-9][0-9]{6,14}$'
      description: E.164
    Restaurant:
      type: object
      required: [id, name, address, time_zone, currency, languages, opening_hours, status, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        address: { type: string, minLength: 1, maxLength: 300 }
        time_zone: { $ref: '#/components/schemas/TimeZone' }
        currency: { type: string, enum: [VND] }
        languages: { type: array, items: { $ref: '#/components/schemas/Language' }, minItems: 1, uniqueItems: true }
        opening_hours: { $ref: '#/components/schemas/OpeningHours' }
        status: { type: string, enum: [active, suspended] }
        version: { type: integer }
    OwnerContact:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        email: { $ref: '#/components/schemas/Email' }
        phone: { $ref: '#/components/schemas/Phone' }
    AdminRestaurant:
      allOf:
        - $ref: '#/components/schemas/Restaurant'
        - type: object
          required: [created_at]
          properties:
            owner_contact: { $ref: '#/components/schemas/OwnerContact' }
            suspended_at: { type: string, format: date-time }
            suspension_reason: { type: string, maxLength: 500 }
            created_at: { type: string, format: date-time }
    RestaurantPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminRestaurant' } }
        next_cursor: { type: string }
    RestaurantUpdate:
      type: object
      description: Only the fields to change. `languages` must include `vi`
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        address: { type: string, minLength: 1, maxLength: 300 }
        time_zone: { $ref: '#/components/schemas/TimeZone' }
        languages: { type: array, items: { $ref: '#/components/schemas/Language' }, minItems: 1, uniqueItems: true }
        opening_hours: { $ref: '#/components/schemas/OpeningHours' }
    AdminRestaurantUpdate:
      allOf:
        - $ref: '#/components/schemas/RestaurantUpdate'
        - type: object
          properties:
            owner_contact: { $ref: '#/components/schemas/OwnerContact' }
    SuspendRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    OnboardRestaurantRequest:
      type: object
      required: [name, address, first_manager]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        address: { type: string, minLength: 1, maxLength: 300 }
        time_zone: { $ref: '#/components/schemas/TimeZone' }
        languages: { type: array, items: { $ref: '#/components/schemas/Language' }, minItems: 1, uniqueItems: true }
        opening_hours: { $ref: '#/components/schemas/OpeningHours' }
        owner_contact: { $ref: '#/components/schemas/OwnerContact' }
        first_manager:
          type: object
          required: [email, display_name]
          properties:
            email: { $ref: '#/components/schemas/Email' }
            display_name: { type: string, minLength: 1, maxLength: 100 }
            phone: { $ref: '#/components/schemas/Phone' }
    OnboardRestaurantResponse:
      type: object
      required: [restaurant, first_manager, invitation]
      properties:
        restaurant: { $ref: '#/components/schemas/AdminRestaurant' }
        first_manager: { $ref: '#/components/schemas/Member' }
        invitation: { $ref: '#/components/schemas/IssuedLink' }
    IssuedLink:
      type: object
      required: [link, expires_at]
      description: One-time link, shown once and never stored in plain text. Pass it on to the person
      properties:
        link: { type: string, examples: ['https://staff.example.invalid/invite#<token>'] }
        expires_at: { type: string, format: date-time }
    Member:
      type: object
      required: [id, email, display_name, role, status, created_at, version]
      properties:
        id: { type: string, format: uuid }
        email: { $ref: '#/components/schemas/Email' }
        display_name: { type: string, minLength: 1, maxLength: 100 }
        phone: { $ref: '#/components/schemas/Phone' }
        role: { $ref: '#/components/schemas/StaffRole' }
        status: { type: string, enum: [invited, active, deactivated] }
        created_at: { type: string, format: date-time }
        deactivated_at: { type: string, format: date-time }
        version: { type: integer }
    MemberPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Member' } }
        next_cursor: { type: string }
    InviteMemberRequest:
      type: object
      required: [email, display_name, role]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        display_name: { type: string, minLength: 1, maxLength: 100 }
        phone: { $ref: '#/components/schemas/Phone' }
        role: { $ref: '#/components/schemas/StaffRole' }
    InvitedMember:
      type: object
      required: [member, invitation]
      properties:
        member: { $ref: '#/components/schemas/Member' }
        invitation: { $ref: '#/components/schemas/IssuedLink' }
    MemberUpdate:
      type: object
      minProperties: 1
      properties:
        display_name: { type: string, minLength: 1, maxLength: 100 }
        phone: { $ref: '#/components/schemas/Phone' }
        role: { $ref: '#/components/schemas/StaffRole' }
    AdminAccount:
      type: object
      required: [id, email, display_name, status, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { $ref: '#/components/schemas/Email' }
        display_name: { type: string }
        status: { type: string, enum: [invited, active, deactivated] }
        created_at: { type: string, format: date-time }
    AdminAccountPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminAccount' } }
        next_cursor: { type: string }
    InviteAdminRequest:
      type: object
      required: [email, display_name]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        display_name: { type: string, minLength: 1, maxLength: 100 }
    InvitedAdmin:
      type: object
      required: [admin, invitation]
      properties:
        admin: { $ref: '#/components/schemas/AdminAccount' }
        invitation: { $ref: '#/components/schemas/IssuedLink' }
    AuditEvent:
      type: object
      required: [id, occurred_at, action, actor, details]
      properties:
        id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        action: { type: string, examples: [staff.role_changed] }
        actor:
          type: object
          required: [type]
          properties:
            type: { type: string, enum: [staff, admin, guest, system, anonymous] }
            id: { type: string, format: uuid }
            display_name: { type: string, description: '"Deleted user" once anonymised' }
        target:
          type: object
          properties:
            type: { type: string }
            id: { type: string, format: uuid }
        request_id: { type: string }
        details: { type: object, additionalProperties: true }
    AuditEventPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        next_cursor: { type: string }
    AdminAuditEvent:
      allOf:
        - $ref: '#/components/schemas/AuditEvent'
        - type: object
          properties:
            ip: { type: string }
            user_agent: { type: string }
    AdminAuditEventPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminAuditEvent' } }
        next_cursor: { type: string }
    StaffDataExport:
      type: object
      required: [account, audit_events]
      description: Personal fields only; never hashes, secrets or tokens
      properties:
        account:
          type: object
          properties:
            id: { type: string, format: uuid }
            email: { $ref: '#/components/schemas/Email' }
            display_name: { type: string }
            phone: { $ref: '#/components/schemas/Phone' }
            role: { $ref: '#/components/schemas/StaffRole' }
            restaurant_id: { type: string, format: uuid }
            status: { type: string }
            created_at: { type: string, format: date-time }
            deactivated_at: { type: string, format: date-time }
        audit_events: { type: array, items: { $ref: '#/components/schemas/AdminAuditEvent' } }
    EraseResult:
      type: object
      required: [staff_id, anonymised_at, last_manager_removed]
      properties:
        staff_id: { type: string, format: uuid }
        anonymised_at: { type: string, format: date-time }
        last_manager_removed: { type: boolean, description: 'True when the restaurant now has no active manager' }

# Error-code catalogue (architecture §5). Feature designs add their codes here.
x-error-catalogue:
  - { code: malformed_request, status: 400, meaning: Body isn't valid JSON, or a field has the wrong type }
  - { code: validation_failed, status: 400, meaning: Field rules failed; see errors }
  - { code: idempotency_key_required, status: 400, meaning: The operation needs an Idempotency-Key }
  - { code: password_rejected, status: 400, meaning: 'Password too short, too long, too common or equal to the email; errors[0].code says which' }
  - { code: unauthenticated, status: 401, meaning: Token missing, invalid, expired, wrong audience, or its session has ended }
  - { code: invalid_credentials, status: 401, meaning: Sign-in, MFA or current-password check failed (one answer for every reason) }
  - { code: forbidden, status: 403, meaning: The caller's role lacks the operation }
  - { code: restaurant_suspended, status: 403, meaning: The caller's restaurant is suspended }
  - { code: not_found, status: 404, meaning: Doesn't exist, or belongs to another restaurant or session }
  - { code: link_invalid, status: 404, meaning: Invitation or reset link unknown, used, replaced or expired }
  - { code: idempotency_request_in_progress, status: 409, meaning: The same Idempotency-Key is still being processed; retry }
  - { code: precondition_failed, status: 412, meaning: If-Match is stale }
  - { code: payload_too_large, status: 413, meaning: Body over 64 KB }
  - { code: unsupported_media_type, status: 415, meaning: Body isn't application/json }
  - { code: idempotency_key_reused, status: 422, meaning: Same Idempotency-Key with a different request }
  - { code: client_upgrade_required, status: 426, meaning: Mobile app below the minimum supported version }
  - { code: precondition_required, status: 428, meaning: If-Match missing }
  - { code: rate_limited, status: 429, meaning: Rate limit reached; see Retry-After }
  - { code: internal_error, status: 500, meaning: Unexpected error; quote request_id }
  - { code: service_unavailable, status: 503, meaning: Database unreachable or timed out; see Retry-After }
  - { code: service_busy, status: 503, meaning: No password-hashing slot free; retry after 1 s }
  - { code: email_in_use, status: 409, meaning: An account with that email exists }
  - { code: last_manager, status: 409, meaning: The change would leave the restaurant without an active manager }
  - { code: last_admin, status: 409, meaning: The change would leave no active platform admin }
  - { code: self_action_not_allowed, status: 409, meaning: An admin deactivating or resetting themselves }
  - { code: member_state_conflict, status: 409, meaning: 'Invitation re-issue for a non-invited member, or a reset for a non-active one' }
  - { code: member_limit_reached, status: 409, meaning: The restaurant has 100 invited and active accounts }
