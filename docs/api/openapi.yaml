        type:
          type: string
          description: 'Clients ignore types they do not know but still move their cursor (design/realtime.md §5)'
          examples: [OrderPlaced, OrderStatusChanged, OrderLineRejected, TableSessionMoved, TableSessionClosed, WaiterCallAcknowledged]
        aggregate:
          type: object
          required: [type, id]
          properties:
            type: { type: string, examples: [order, bill, table_session, waiter_call, menu] }
            id: { type: string, format: uuid }
            version: { type: integer }
        session_id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
    GuestEventsPage:
      type: object
      required: [events, orders, waiter_calls, cursor, has_more]
      properties:
        events: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/DomainEvent' } }
        orders: { type: array, description: 'Current state of each order the events name', items: { $ref: '#/components/schemas/Order' } }
        waiter_calls: { type: array, items: { $ref: '#/components/schemas/WaiterCall' } }
        cursor: { type: integer, format: int64, description: 'Send back as `after`' }
        has_more: { type: boolean }
        reset: { type: boolean, description: 'The cursor was too old or ahead; reload the screen and continue from `cursor`' }
    StaffEventsPage:
      allOf:
        - $ref: '#/components/schemas/GuestEventsPage'
    RealtimeTokenRequest:
      type: object
      description: 'An Ably TokenRequest, signed by the server; the client SDK exchanges it with Ably. Capability: subscribe on one channel. Fields keep Ably''s camelCase names, the one exception to snake_case'
      required: [keyName, ttl, capability, timestamp, nonce, mac]
      properties:
        keyName: { type: string }
        ttl: { type: integer, description: Milliseconds }
        capability: { type: string, description: 'JSON, e.g. {"session.<id>":["subscribe"]}' }
        timestamp: { type: integer, format: int64 }
        nonce: { type: string }
        mac: { type: string }
    PaymentSales:
      type: object
      required: [method, sessions, amount, corrections]
      properties:
        method: { $ref: '#/components/schemas/PaymentMethod' }
        sessions: { type: integer }
        amount: { $ref: '#/components/schemas/Money' }
        corrections: { $ref: '#/components/schemas/Money' }
    TableSales:
      type: object
      required: [table_id, number, sessions, gross]
      properties:
        table_id: { type: string, format: uuid }
        number: { type: string, description: 'The table number as it was that day' }
        sessions: { type: integer }
        gross: { $ref: '#/components/schemas/Money' }
    ItemSales:
      type: object
      required: [item_id, name_vi, quantity, revenue]
      properties:
        item_id: { type: string, format: uuid }
        name_vi: { type: string }
        name_en: { type: string }
        quantity: { type: integer }
        revenue: { $ref: '#/components/schemas/Money' }
    SalesTotals:
      type: object
      required: [sessions, orders, gross, corrections, net, payments]
      properties:
        sessions: { type: integer, description: 'Bills closed with a payment' }
        orders: { type: integer }
        gross: { $ref: '#/components/schemas/Money' }
        corrections: { $ref: '#/components/schemas/Money' }
        net: { $ref: '#/components/schemas/Money' }
        payments: { type: array, items: { $ref: '#/components/schemas/PaymentSales' } }
    SalesDay:
      allOf:
        - $ref: '#/components/schemas/SalesTotals'
        - type: object
          required: [date, correction_count, tables, top_items_by_quantity, top_items_by_revenue]
          properties:
            date: { type: string, format: date }
            correction_count: { type: integer }
            tables: { type: array, items: { $ref: '#/components/schemas/TableSales' } }
            top_items_by_quantity: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/ItemSales' } }
            top_items_by_revenue: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/ItemSales' } }
    DailySalesReport:
      type: object
      required: [from, to, time_zone, totals, days]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        time_zone: { $ref: '#/components/schemas/TimeZone' }
        totals: { $ref: '#/components/schemas/SalesTotals' }
        days: { type: array, maxItems: 93, items: { $ref: '#/components/schemas/SalesDay' } }

# Error-code catalogue (architecture §5). Feature designs add their codes here.
x-error-catalogue:
  - { code: malformed_request, status: 400, meaning: 'Body isn''t valid JSON, or a field has the wrong type' }
  - { code: validation_failed, status: 400, meaning: Field rules failed; see errors }
  - { code: idempotency_key_required, status: 400, meaning: The operation needs an Idempotency-Key }
  - { code: password_rejected, status: 400, meaning: 'Password too short, too long, too common or equal to the email; errors[0].code says which' }
  - { code: unauthenticated, status: 401, meaning: 'Token missing, invalid, expired, wrong audience, or its session has ended' }
  - { code: invalid_credentials, status: 401, meaning: 'Sign-in, MFA or current-password check failed (one answer for every reason)' }
  - { code: forbidden, status: 403, meaning: The caller's role lacks the operation }
  - { code: restaurant_suspended, status: 403, meaning: The caller's restaurant is suspended }
  - { code: not_found, status: 404, meaning: 'Doesn''t exist, or belongs to another restaurant or session' }
  - { code: link_invalid, status: 404, meaning: 'Invitation or reset link unknown, used, replaced or expired' }
  - { code: idempotency_request_in_progress, status: 409, meaning: The same Idempotency-Key is still being processed; retry }
  - { code: precondition_failed, status: 412, meaning: If-Match is stale }
  - { code: payload_too_large, status: 413, meaning: Body over 64 KB }
  - { code: unsupported_media_type, status: 415, meaning: Body isn't application/json }
  - { code: idempotency_key_reused, status: 422, meaning: Same Idempotency-Key with a different request }
  - { code: client_upgrade_required, status: 426, meaning: Mobile app below the minimum supported version }
  - { code: precondition_required, status: 428, meaning: If-Match missing }
  - { code: rate_limited, status: 429, meaning: Rate limit reached; see Retry-After }
  - { code: internal_error, status: 500, meaning: Unexpected error; quote request_id }
  - { code: service_unavailable, status: 503, meaning: Database unreachable or timed out; see Retry-After }
  - { code: service_busy, status: 503, meaning: No password-hashing slot free; retry after 1 s }
  - { code: email_in_use, status: 409, meaning: An account with that email exists }
  - { code: last_manager, status: 409, meaning: The change would leave the restaurant without an active manager }
  - { code: last_admin, status: 409, meaning: The change would leave no active platform admin }
  - { code: self_action_not_allowed, status: 409, meaning: An admin deactivating or resetting themselves }
  - { code: member_state_conflict, status: 409, meaning: 'Invitation re-issue for a non-invited member, or a reset for a non-active one' }
  - { code: member_limit_reached, status: 409, meaning: The restaurant has 100 invited and active accounts }
  - { code: image_invalid, status: 400, meaning: 'Image not decodable, or over 40 megapixels' }
  - { code: duplicate_name, status: 409, meaning: A category or item name already used in the same scope }
  - { code: category_not_empty, status: 409, meaning: Deleting a category that still has items }
  - { code: menu_limit_reached, status: 409, meaning: A menu size limit would be passed }
  - { code: image_storage_unavailable, status: 503, meaning: Image storage unreachable or timed out }
  - { code: qr_token_invalid, status: 400, meaning: 'Malformed, forged or rotated QR code, or a deleted table' }
  - { code: table_session_closed, status: 401, meaning: The guest's session has been closed; scan the code again }
  - { code: table_unavailable, status: 409, meaning: The table is disabled or deleted }
  - { code: table_occupied, status: 409, meaning: Moving a session onto a table that has one }
  - { code: table_has_open_session, status: 409, meaning: Disabling or deleting a table with guests }
  - { code: session_not_open, status: 409, meaning: The table session is closed }
  - { code: table_limit_reached, status: 409, meaning: The restaurant has 300 tables }
  - { code: item_unavailable, status: 409, meaning: 'An ordered item is hidden or sold out; unavailable_items lists them' }
  - { code: order_not_cancellable, status: 409, meaning: 'The kitchen has accepted the order, or it has finished; ask staff' }
  - { code: invalid_transition, status: 409, meaning: The status step is not allowed from the order's current status }
  - { code: line_not_rejectable, status: 409, meaning: 'The line is already rejected, or the order is not accepted or preparing' }
  - { code: orders_not_finished, status: 409, meaning: 'Closing with unfinished orders without force; order_ids lists them' }
  - { code: bill_not_closed, status: 409, meaning: Correcting a bill that is still open }
