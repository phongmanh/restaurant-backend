openapi: 3.1.0
info:
  title: Restaurant ordering API
  version: 1.1.0
  description: |
    Contract for the restaurant ordering service (`docs/sdlc/restaurant-ordering/`).
    Hand-written in Phase 3 and frozen at G3 on 2026-10-15 (architecture §5, ADR-0007). Changes need a CR;
    within `/v1` they must be additive (NFR-COMPAT-01).
    Built up one feature design at a time; it holds the shared parts and
    `/v1/auth/*` from `design/core-and-auth.md`, and the routes of
    `design/restaurants.md`, `design/menu.md`, `design/tables.md`, `design/orders.md`, `design/realtime.md` and `design/reports.md`. `x-allowed-when-suspended` on staff and guest
    operations mirrors the endpoint registry (restaurants §6).

    Conventions (core-and-auth §2): snake_case fields; UUID v7 IDs; RFC 3339 UTC times;
    money as `{"amount": "<whole đồng>", "currency": "VND"}`; errors as
    `application/problem+json` with a stable `code` (catalogue in `x-error-catalogue`).
    Any operation may also answer the shared codes of core-and-auth §3 without listing them:
    `413 payload_too_large` and `415 unsupported_media_type` (operations with a body),
    `426 client_upgrade_required`, `500 internal_error` and `503 service_unavailable`.
    An operation lists one of them only when it has its own reason to (CR-010).
    An update of a versioned resource is `POST <path>/update` with `If-Match`; the `PATCH` forms are
    deprecated and kept only for compatibility within `/v1`, because Vercel's edge answers them `412` (CR-012).
servers:
  - url: https://api.example.invalid
    description: Placeholder until the environments' URLs are fixed

tags:
  - name: auth
    description: Staff and admin sign-in, sessions, invitations and password resets
  - name: restaurants
    description: The caller's own restaurant profile
  - name: staff
    description: Staff management in a restaurant
  - name: audit
    description: Reading the audit log
  - name: admin
    description: Platform-admin operations on restaurants and admins
  - name: privacy
    description: Staff data export and erasure requests
  - name: menu
    description: Menu reads for guests, staff and admins; menu editing, sold-out and images
  - name: tables
    description: Tables, QR codes, table sessions and waiter calls
  - name: orders
    description: Orders, their status steps, bills, closing a session with its payment, and bill corrections
  - name: realtime
    description: Catch-up from the event log and Ably subscription tokens
  - name: reports
    description: Daily sales reports for managers

paths:
  /v1/auth/sign-in:
    post:
      tags: [auth]
      operationId: signIn
      x-allowed-when-suspended: true
      security: []   # no token: public sign-in route
      summary: Sign in with email and password
      description: |
        Staff get tokens straight away. Platform admins get an MFA challenge instead
        (`mfa_required: true`) and finish with `POST /v1/auth/mfa`.
        Unknown email, wrong password, locked and deactivated accounts all give the
        same `401 invalid_credentials`.
      parameters:
        - $ref: '#/components/parameters/XClient'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignInRequest' }
      responses:
        '200':
          description: Signed in (staff), or MFA required (admin)
          headers:
            Set-Cookie:
              description: Refresh cookie, staff only (`__Secure-rt-staff`)
              schema: { type: string }
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignInResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/auth/mfa:
    post:
      tags: [auth]
      operationId: completeMfa
      x-allowed-when-suspended: true
      security: []   # no token: public sign-in route
      summary: Finish an admin sign-in with a TOTP code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaRequest' }
      responses:
        '200':
          description: Signed in as admin
          headers:
            Set-Cookie:
              description: Refresh cookie (`__Secure-rt-admin`)
              schema: { type: string }
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshTokens
      x-allowed-when-suspended: true
      summary: Swap the refresh cookie for a new access token and a new refresh cookie
      description: |
        The refresh token is single-use. Presenting one that was already used ends the
        whole session (core-and-auth §8.3).
      security:
        - refreshCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AudienceRequest' }
      responses:
        '200':
          description: New tokens
          headers:
            Set-Cookie:
              description: The replacement refresh cookie
              schema: { type: string }
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/sign-out:
    post:
      tags: [auth]
      operationId: signOut
      x-allowed-when-suspended: true
      summary: End the session
      description: Always 204, even if no session matched.
      security:
        - refreshCookie: []
        - staffBearer: []
        - adminBearer: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AudienceRequest' }
      responses:
        '204':
          description: Signed out; the refresh cookie is cleared
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/links/inspect:
    post:
      tags: [auth]
      operationId: inspectLink
      x-allowed-when-suspended: true
      security: []   # no token: public sign-in route
      summary: Show what an invitation or reset link is for, without using it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkTokenRequest' }
      responses:
        '200':
          description: Link details
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkDetails' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/LinkInvalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/invitations/accept:
    post:
      tags: [auth]
      operationId: acceptInvitation
      x-allowed-when-suspended: true
      security: []   # no token: public sign-in route
      summary: Set a password through an invitation link (and enrol TOTP for an admin)
      description: |
        Staff: one call → 204. Platform admin: the first call (without `totp_code`)
        returns `totp_setup` and leaves the link valid; the second call with the same
        token and password plus `totp_code` → 204 (core-and-auth §8.5).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInvitationRequest' }
      responses:
        '200':
          description: 'Admin only: scan this secret, then call again with a code'
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpSetupResponse' }
        '204':
          description: Account active; sign in next
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/LinkInvalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/password-resets/complete:
    post:
      tags: [auth]
      operationId: completePasswordReset
      x-allowed-when-suspended: true
      security: []   # no token: public sign-in route
      summary: Set a new password through a reset link
      description: Ends all of the person's sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompletePasswordResetRequest' }
      responses:
        '204':
          description: Password changed; sign in next
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/LinkInvalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      x-allowed-when-suspended: true
      summary: Change your own password
      description: Ends all of the person's sessions, including this one.
      security:
        - staffBearer: []
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204':
          description: Password changed; sign in again
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      x-allowed-when-suspended: true
      summary: Who the signed-in caller is
      security:
        - staffBearer: []
        - adminBearer: []
      responses:
        '200':
          description: The caller
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/staff/restaurant:
    get:
      tags: [restaurants]
      operationId: getOwnRestaurant
      summary: Read your restaurant's profile (all roles)
      security:
        - staffBearer: []
      x-allowed-when-suspended: true
      responses:
        '200':
          description: The profile
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Restaurant' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [restaurants]
      operationId: updateOwnRestaurant
      summary: Edit your restaurant's profile (manager)
      deprecated: true
      description: "Kept for compatibility within `/v1`; use `POST /v1/staff/restaurant/update`. Through Vercel's edge this answers `412` even when the change is saved (D-1, CR-012)."
      security:
        - staffBearer: []
      x-allowed-when-suspended: false
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestaurantUpdate' }
      responses:
        '200':
          description: Updated
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Restaurant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /v1/staff/restaurant/update:
    post:
      tags: [restaurants]
      operationId: updateOwnRestaurantPost
      summary: "Edit your restaurant's profile (manager)"
      description: "The update of `/v1/staff/restaurant`, sent as `POST`; clients use this form. It takes the same body, `If-Match` and rules as the `PATCH`, which Vercel's edge answers with its own `412` after the change is saved (D-1, CR-012)."
      security:
        - staffBearer: []
      x-allowed-when-suspended: false
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestaurantUpdate' }
      responses:
        '200':
          description: Updated
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Restaurant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /v1/staff/members:
    get:
      tags: [staff]
      operationId: listMembers
      summary: List staff members
      security:
        - staffBearer: []
      x-allowed-when-suspended: false
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/MemberStatusFilter'
        - $ref: '#/components/parameters/MemberRoleFilter'
      responses:
        '200':
          description: A page of members
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [staff]
      operationId: inviteMember
      summary: Invite a staff member; the response holds the one-time link
      security:
        - staffBearer: []
      x-allowed-when-suspended: false
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteMemberRequest' }
      responses:
        '201':
          description: Invited
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitedMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/staff/members/{staffId}:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    get:
      tags: [staff]
      operationId: getMember
      summary: Read a staff member
      security:
        - staffBearer: []
      x-allowed-when-suspended: false
      responses:
        '200':
          description: The member
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [staff]
      operationId: updateMember
      summary: Change name, phone or role (role change ends their sessions)
      deprecated: true
      description: "Kept for compatibility within `/v1`; use `POST /v1/staff/members/{staffId}/update`. Through Vercel's edge this answers `412` even when the change is saved (D-1, CR-012)."
      security:
        - staffBearer: []
      x-allowed-when-suspended: false
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberUpdate' }
      responses:
        '200':
          description: Updated
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /v1/staff/members/{staffId}/update:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    post:
      tags: [staff]
      operationId: updateMemberPost
      summary: "Change name, phone or role (role change ends their sessions)"
      description: "The update of `/v1/staff/members/{staffId}`, sent as `POST`; clients use this form. It takes the same body, `If-Match` and rules as the `PATCH`, which Vercel's edge answers with its own `412` after the change is saved (D-1, CR-012)."
      security:
        - staffBearer: []
      x-allowed-when-suspended: false
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberUpdate' }
      responses:
        '200':
          description: Updated
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /v1/staff/members/{staffId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    post:
      tags: [staff]
      operationId: deactivateMember
      summary: Deactivate (ends their sessions)
      security:
        - staffBearer: []
      x-allowed-when-suspended: false
      responses:
        '200':
          description: Deactivated, or already was
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/staff/members/{staffId}/reactivate:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    post:
      tags: [staff]
      operationId: reactivateMember
      summary: Reactivate a deactivated member who isn't anonymised yet
      security:
        - staffBearer: []
      x-allowed-when-suspended: false
      responses:
        '200':
          description: Active
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/staff/members/{staffId}/invitation:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    post:
      tags: [staff]
      operationId: invitationMember
      summary: Re-issue the invitation link; the old one stops working
      security:
        - staffBearer: []
      x-allowed-when-suspended: false
      responses:
        '201':
          description: New link
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedLink' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/staff/members/{staffId}/password-reset:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    post:
      tags: [staff]
      operationId: passwordResetMember
      summary: Issue a password-reset link (24 h)
      security:
        - staffBearer: []
      x-allowed-when-suspended: false
      responses:
        '201':
          description: New link
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedLink' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/staff/audit-events:
    get:
      tags: [audit]
      operationId: listOwnAuditEvents
      summary: Read your restaurant's audit log (manager; no IP or user agent)
      security:
        - staffBearer: []
      x-allowed-when-suspended: true
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
        - $ref: '#/components/parameters/AuditAction'
        - $ref: '#/components/parameters/AuditActor'
        - $ref: '#/components/parameters/AuditTarget'
      responses:
        '200':
          description: Newest first
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/restaurants:
    get:
      tags: [admin]
      operationId: listRestaurants
      x-allowed-when-suspended: true
      summary: List restaurants
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/RestaurantStatusFilter'
        - $ref: '#/components/parameters/RestaurantNamePrefix'
      responses:
        '200':
          description: A page of restaurants
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestaurantPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [admin]
      operationId: onboardRestaurant
      x-allowed-when-suspended: true
      summary: Onboard a restaurant and invite its first manager
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardRestaurantRequest' }
      responses:
        '201':
          description: Created. A replay with the same key returns the restaurant with a fresh link
