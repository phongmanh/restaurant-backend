# The service's CI (architecture §14). The skeleton runs steps 1–3 and 6 of that list: build,
# ktlint and detekt, the tests (unit and testApplication), the Kover gate. It also lints the
# contract. Later Phase 4 steps add Testcontainers PostgreSQL, contract tests and oasdiff, the
# dependency and secret scans, the Vercel bundle, and preview deploys.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, lint and test
        run: ./gradlew --no-daemon build
      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/
          retention-days: 7

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Lint docs/api/openapi.yaml
        # Run outside the repository so npx leaves no files in it (CLAUDE.md).
        working-directory: ${{ runner.temp }}
        run: npx --yes @redocly/cli@1.34.5 lint "$GITHUB_WORKSPACE/docs/api/openapi.yaml"
