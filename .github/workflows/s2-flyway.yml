# S-2 spike, Q6: can CI run Flyway as `migrator` over Neon's direct connection, and is `app`
# denied DDL? Throwaway, deleted with spikes/s2-postgres.
#
# workflow_dispatch works only once this file is on the default branch, so it also runs on a push
# that changes the spike's code, its build or this file.
#
# Secrets (Settings → Secrets and variables → Actions): DATABASE_URL_MIGRATOR_DIRECT and
# DATABASE_URL_APP_DIRECT, the same values as spikes/s2-postgres/.env.spike.
name: s2-flyway

on:
  workflow_dispatch:
  push:
    paths:
      - spikes/s2-postgres/src/main/**
      - spikes/s2-postgres/build.gradle.kts
      - spikes/s2-postgres/gradle/**
      - .github/workflows/s2-flyway.yml

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: spikes/s2-postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Flyway as migrator, then DDL probes as app
        env:
          DATABASE_URL_MIGRATOR_DIRECT: ${{ secrets.DATABASE_URL_MIGRATOR_DIRECT }}
          DATABASE_URL_APP_DIRECT: ${{ secrets.DATABASE_URL_APP_DIRECT }}
        run: ./gradlew --no-daemon -q migrate
