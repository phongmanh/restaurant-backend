# Weekly update PRs for the service's libraries and CI's actions (ASVS V15.2.1, F-3; deploy/README.md
# "Vulnerable dependencies"). Minor and patch updates come grouped in one PR, so a week makes at most
# a few. The base images are pinned by digest (release-checklist P-2), so the `docker` entry moves them
# to the patched images. Spikes are throwaway code and aren't watched.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      libraries:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
