# Toolchain pinned at the start of Phase 4 (2026-10-15), latest stable on Maven Central and the
# Gradle plugin portal that day (architecture §3). JDK 25 comes from the Gradle toolchain in
# build.gradle.kts. PostgreSQL server: 18, as Neon runs it (S-2 ran on 18.6).
#
# Entries the skeleton doesn't use yet are pinned here so later steps don't drift.

[versions]
kotlin = "2.4.21"
ktor = "3.6.0"
kotlinxSerialization = "1.12.0"
logback = "1.6.5"
logstashEncoder = "9.0"
# Raised over what java-jwt, Flyway (2.x) and the logstash encoder (3.x) bring: fixes for High
# advisories that CI's Grype check found (F-3, step 6a).
jackson2 = "2.22.4"
jackson3 = "3.2.4"
uuidGenerator = "5.2.0"
exposed = "1.6.0"
postgresql = "42.7.14"
hikari = "7.1.0"
flyway = "13.11.1"
koin = "4.2.2"
bouncycastle = "1.86"
javaJwt = "4.6.2"
# Realtime (step 8, 2026-10-16): the official SDK, for token requests and REST publishing (realtime §8, §4.2).
ably = "1.8.2"
testcontainers = "2.0.5"
snakeyamlEngine = "3.2"
# G4 hardening H3 (2026-10-17): validates test responses against the contract (OpenAPI 3.1, JSON Schema 2020-12).
jsonSchemaValidator = "3.0.8"
ktlintGradle = "14.2.0"
ktlint = "1.8.0"
detekt = "1.23.8"
kover = "0.9.11"
cyclonedx = "3.5.1"
# Phase 5 step 4 (2026-10-17): metrics pushed over OTLP (ADR-0009); the version Ktor 3.6.0's metrics plugin is built on.
micrometer = "1.17.2"

[libraries]
ktor-bom = { module = "io.ktor:ktor-bom", version.ref = "ktor" }
jackson2-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson2" }
jackson3-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson3" }
ktor-server-core = { module = "io.ktor:ktor-server-core" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty" }
ktor-server-config-yaml = { module = "io.ktor:ktor-server-config-yaml" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging" }
ktor-server-call-id = { module = "io.ktor:ktor-server-call-id" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors" }
ktor-server-double-receive = { module = "io.ktor:ktor-server-double-receive" }
ktor-server-body-limit = { module = "io.ktor:ktor-server-body-limit" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host" }
ktor-server-metrics-micrometer = { module = "io.ktor:ktor-server-metrics-micrometer" }
micrometer-registry-otlp = { module = "io.micrometer:micrometer-registry-otlp", version.ref = "micrometer" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstashEncoder" }
uuid-generator = { module = "com.fasterxml.uuid:java-uuid-generator", version.ref = "uuidGenerator" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-java-time = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-ktor = { module = "io.insert-koin:koin-ktor" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
java-jwt = { module = "com.auth0:java-jwt", version.ref = "javaJwt" }
ably-java = { module = "io.ably:ably-java", version.ref = "ably" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
detekt-cli = { module = "io.gitlab.arturbosch.detekt:detekt-cli", version.ref = "detekt" }
snakeyaml-engine = { module = "org.snakeyaml:snakeyaml-engine", version.ref = "snakeyamlEngine" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "jsonSchemaValidator" }
# Phase 5 step 4c: reads the OTLP push in tests. The version micrometer-registry-otlp brings at runtime.
opentelemetry-proto = { module = "io.opentelemetry.proto:opentelemetry-proto", version = "1.11.1-alpha" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
