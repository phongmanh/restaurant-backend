ktor:
  deployment:
    # Vercel routes to $PORT; 8080 locally.
    port: "$PORT:8080"
  application:
    modules:
      - io.github.phongmanh.restaurant.ApplicationKt.module

# Read into AppConfig (core-and-auth §13). Secrets have an empty default, so AppConfig can name every
# missing one at once instead of failing on the first.
app:
  # dev | preview | staging | production
  environment: "$APP_ENV:dev"

database:
  # The `app` and `app_platform` roles through Neon's pooler, as postgresql://user:password@host/db?sslmode=require
  url: "$DATABASE_URL:"
  platformUrl: "$DATABASE_URL_PLATFORM:"
  # ADR-0004: up to 10 connections per instance, a 2 s wait for one, statements stopped after 5 s.
  maxPoolSize: "$DATABASE_MAX_POOL_SIZE:10"
  platformMaxPoolSize: "$DATABASE_PLATFORM_MAX_POOL_SIZE:3"
  connectionTimeoutMs: 2000
  statementTimeoutMs: 5000

http:
  # The web apps' origins, comma-separated, e.g. https://order.example.com
  allowedOrigins: "$ALLOWED_ORIGINS:"
  minClientVersions:
    customer-android: "$MIN_VERSION_CUSTOMER_ANDROID:1.0.0"
    customer-ios: "$MIN_VERSION_CUSTOMER_IOS:1.0.0"

# Staff and admin sign-in (core-and-auth §8, §13).
auth:
  # The API's public URL, the tokens' `iss`.
  issuer: "$AUTH_ISSUER:http://localhost:8080"
  # Secrets. A JWK set of EC P-256 keys: the current key with its private part `d`, the previous one public only.
  staffJwtKeys: "$STAFF_JWT_KEYS:"
  # {"current": "<id>", "keys": {"<id>": "<base64 of 32 random bytes>"}}
  totpEncryptionKeys: "$TOTP_ENCRYPTION_KEYS:"
  # Base64 of at least 32 random bytes.
  emailHmacKey: "$EMAIL_HMAC_KEY:"
  # The refresh cookie's path as the browser sees it through the web apps' /api rewrite (§8.3).
  cookiePath: "$AUTH_COOKIE_PATH:/api/v1/auth"
  # Where invitation and reset links open (restaurants §5, §7): <url>/invite#<token>, <url>/reset-password#<token>.
  # Admins' links open in the admin web app. Production needs https.
  staffAppUrl: "$STAFF_APP_URL:http://localhost:5173"
  adminAppUrl: "$ADMIN_APP_URL:http://localhost:5174"
  # Architecture §7: OWASP's Argon2id parameters; at most 4 hashes at once, a 2 s wait for a slot.
  argon2:
    memoryKib: 19456
    iterations: 2
    parallelism: 1
    maxConcurrent: 4
    slotWaitMs: 2000

# Guests (tables §2, §3.2; ADR-0006).
guests:
  # Secrets. JWK sets in the format of auth.staffJwtKeys, each with keys of its own.
  sessionJwtKeys: "$GUEST_JWT_KEYS:"
  # QR key IDs are numbers 0-255, as a printed code carries one byte. Old public keys stay in the set
  # while codes they signed are still printed (§13 Q5).
  qrSigningKeys: "$QR_SIGNING_KEYS:"
  # Where printed codes open: <url>/t/<token>. Production needs https.
  customerAppUrl: "$CUSTOMER_APP_URL:http://localhost:5175"

# Scheduled jobs (core-and-auth §2, §13). The secret Vercel Cron sends as a bearer token.
jobs:
  cronSecret: "$CRON_SECRET:"

# ADR-0008. Upstash is required outside dev and test; without it, limits count in memory.
rateLimits:
  upstashUrl: "$UPSTASH_REDIS_REST_URL:"
  upstashToken: "$UPSTASH_REDIS_REST_TOKEN:"
  # S-1 Q12: a check that takes longer fails open.
  timeoutMs: 200
  # <limit>/<window seconds>, starting values accepted by the owner (core-and-auth §11).
  policies:
    auth:
      sign_in: "30/60"
      mfa: "10/60"
      refresh: "120/60"
      link: "10/60"
      password_change: "5/900"
    # restaurants §7, §15 Q6: invitation and reset links per restaurant.
    staff:
      link: "30/3600"
    # tables §9, §13 Q4: QR scans per device, table and IP; new waiter calls per table session.
    qr:
      present_device: "10/60"
      present_table: "30/60"
      present_ip: "60/60"
    waiter_call: "10/3600"
    # orders §10, §15 Q6: new orders per session, per restaurant and per staff member; guest cancels
    # per session; staff status changes and line rejections per staff member.
    order:
      place_session: "10/60"
      place_restaurant: "300/60"
      place_staff: "30/60"
      cancel: "30/60"
      staff_change: "240/60"
